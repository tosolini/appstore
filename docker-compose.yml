services:
  appstore-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: container-appstore:latest
    container_name: container-appstore-api
    ports:
      - "8888:8888"
    environment:
      HOST: 0.0.0.0
      PORT: 8888
      CACHE_DIR: /app/cache
      GIT_SYNC_INTERVAL: 604800 # 7 days in seconds
      REPOSITORIES: |
        [
          {
            "name": "CasaOS AppStore",
            "url": "https://github.com/IceWhaleTech/CasaOS-AppStore.git",
            "branch": "main",
            "priority": 100,
            "enabled": true
          },
          {
            "name": "LinuxServer",
            "url": "https://github.com/WisdomSky/CasaOS-LinuxServer-AppStore.git",
            "branch": "main",
            "priority": 98,
            "enabled": false
          },
          {
            "name": "BigBear",
            "url": "https://github.com/bigbeartechworld/big-bear-casaos.git",
            "branch": "master",
            "priority": 96,
            "enabled": false
          },
          {
            "name": "Coolstore",
            "url": "https://github.com/WisdomSky/CasaOS-Coolstore.git",
            "branch": "main",
            "priority": 95,
            "enabled": false
          }
        ]
      # Active backend selection: "portainer", "arcane", or "auto" (default)
      ACTIVE_BACKEND: "${ACTIVE_BACKEND:-auto}"

      # Portainer integration - use host.docker.internal on macOS/Windows
      PORTAINER_BASE_URL: "${PORTAINER_BASE_URL:-http://host.docker.internal:9443}"
      PORTAINER_API_KEY: "${PORTAINER_API_KEY}"
      PORTAINER_ENDPOINT_ID: "${PORTAINER_ENDPOINT_ID:-3}"
      PORTAINER_VERIFY_SSL: "${PORTAINER_VERIFY_SSL}"
      MOCK_MODE: "${MOCK_MODE}"
      DEBUG_MODE: "${DEBUG_MODE}"

      # Arcane integration
      ARCANE_BASE_URL: "${ARCANE_BASE_URL}"
      ARCANE_API_KEY: "${ARCANE_API_KEY}"
      ARCANE_ENVIRONMENT_ID: "${ARCANE_ENVIRONMENT_ID:-0}"
      ARCANE_VERIFY_SSL: "${ARCANE_VERIFY_SSL:-false}"
      ARCANE_MODE: "${ARCANE_MODE:-auto}"

    volumes:
      - ./data:/app/data
      - appstore_cache:/app/cache
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    restart: unless-stopped

    networks:
      - appstore-net

volumes:
  appstore_cache:
    driver: local

networks:
  appstore-net:
    driver: bridge
